<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Roadtrip Roulette</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <canvas id="game"></canvas>

    <div id="lobby">
      <div class="card">
        <h1>🚐 Roadtrip Roulette</h1>
        <p class="sub">24 hours. $200. One beater RV. Show up to the wedding with at least $100 left.</p>
        <label>Your name <input id="l-name" maxlength="16" /></label>
        <div class="row">
          <button id="l-host" class="primary">Host game</button>
          <button id="l-solo">Play solo</button>
        </div>
        <div class="row">
          <input id="l-code" placeholder="ROOM" maxlength="4" />
          <button id="l-join">Join</button>
        </div>
        <details>
          <summary>Server</summary>
          <input id="l-server" />
        </details>
        <p id="l-status"></p>
      </div>
    </div>

    <div id="fx-smoke"></div>
    <div id="fx-hurt"></div>
    <div id="fx-speed"></div>
    <div id="fx-nos"></div>
    <div id="fx-flash"></div>
    <div id="fx-black"></div>
    <div id="fx-hangry"></div>
    <div id="fx-puke"></div>
    <div id="fx-lid-top" class="lid"></div>
    <div id="fx-lid-bot" class="lid"></div>
    <div id="map" class="hidden"><canvas id="map-canvas" width="900" height="620"></canvas><p>M / click to fold the map</p></div>
    <div id="hud" class="hidden">
      <div id="stats">
        <div id="h-wedding"></div>
        <div id="h-time"></div>
        <div id="h-miles"></div>
        <div id="h-money"><span id="h-money-v"></span><div id="h-money-fly"></div></div>
        <div id="h-badges"></div>
      </div>
      <div id="reticle"></div>
      <div id="cam-warn" class="hidden"></div>
      <div id="prompt" class="hidden"></div>
      <div id="hotbar"><div id="hb-name"></div><div class="hb-row"><div class="hb-slot"><i>1</i><span class="hb-icon"></span><b class="hb-count"></b><em class="hb-price"></em></div><div class="hb-slot"><i>2</i><span class="hb-icon"></span><b class="hb-count"></b><em class="hb-price"></em></div><div class="hb-slot"><i>3</i><span class="hb-icon"></span><b class="hb-count"></b><em class="hb-price"></em></div></div></div>
      <div id="vitals">
        <div class="bar"><span>❤️</span><i><b id="v-hp"></b></i></div>
        <div class="bar"><span>🍔</span><i><b id="v-hunger"></b></i></div>
        <div class="bar"><span>⚡</span><i><b id="v-stam"></b></i><em id="v-buzz"></em></div>
        <div class="bar" id="v-awake-row"><span>😴</span><i><b id="v-awake"></b></i></div>
      </div>
      <div id="gearbox" class="hidden">
        <div class="g-keys"><span>Q ▼</span><span>E ▲</span></div>
        <div id="g-gear">N</div>
        <div id="g-speed">0 mph</div>
        <div id="g-nos">NOS</div>
        <div class="g-rpm"><b id="g-rpm"></b></div>
      </div>
      <div id="hints"></div>
      <div id="toasts"></div>
      <div id="phone"></div>
      <div id="radio-cap" class="hidden"></div>
      <div id="tab" class="hidden"></div>
      <div id="pause" class="hidden">
        <h2>Paused</h2>
        <button id="p-resume" class="primary">Resume</button>
        <div class="p-room" id="p-room"></div>
        <div class="p-group">
          <label>Master <input type="range" id="v-master" min="0" max="1" step="0.01" /><output></output></label>
          <label>Vehicle <input type="range" id="v-vehicle" min="0" max="1" step="0.01" /><output></output></label>
          <label>Effects <input type="range" id="v-effects" min="0" max="1" step="0.01" /><output></output></label>
          <label>Radio <input type="range" id="v-radio" min="0" max="1" step="0.01" /><output></output></label>
          <label>Mouse <input type="range" id="v-sens" min="0.0006" max="0.006" step="0.0001" /><output></output></label>
          <label>FOV <input type="range" id="v-fov" min="60" max="110" step="1" /><output></output></label>
        </div>
        <p class="p-hint">Esc frees the mouse · click Resume to jump back in</p>
      </div>
      <div id="end" class="hidden"><h1></h1><p>Refresh to play again.</p></div>
      <pre id="dev" class="hidden"></pre>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
